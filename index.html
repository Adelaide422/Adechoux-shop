
            <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adechoux - Boutique de Bijoux</title>
    <style>
        :root {
            --primary-color: #FF69B4;
            --secondary-color: #FFB6C1;
            --accent-color: #FFF0F5;
            --text-color: #333333;
            --light-text-color: #777777;
            --bg-color: #FFFFFF;
            --card-bg: #F9F9F9;
            --border-color: #EEEEEE;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; }
        header { background-color: var(--accent-color); padding: 30px 20px; text-align: center; border-bottom: 1px solid var(--border-color); }
        header h1 { margin: 0; font-size: 2.8em; font-weight: 800; color: var(--primary-color); letter-spacing: 1px; }
        header p { margin: 8px 0 0; font-size: 1.1em; color: var(--light-text-color); }
        main { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        main h2 { text-align: center; font-size: 1.8em; margin-bottom: 40px; color: var(--text-color); }
        .products-grid { display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; }
        .product-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 15px; width: 280px; overflow: hidden; transition: transform 0.3s ease; display: flex; flex-direction: column; }
        .product-media { width: 100%; height: 280px; object-fit: cover; border-bottom: 1px solid var(--border-color); }
        .product-info { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-name { font-size: 1.1em; font-weight: 600; margin: 0 0 10px; color: var(--text-color); }
        .product-price { font-size: 1.3em; font-weight: 700; color: var(--primary-color); margin-bottom: 15px; }
        .quantity-selector { display: flex; align-items: center; border: 1px solid var(--border-color); border-radius: 8px; width: 120px; margin-bottom: 15px; background: #fff; }
        .qty-btn { background: none; border: none; padding: 10px 15px; cursor: pointer; }
        .qty-input { flex-grow: 1; text-align: center; border: none; font-weight: 600; width: 30px; background: transparent; }
        .order-btn { background-color: var(--primary-color); color: white; border: none; border-radius: 10px; padding: 14px 20px; font-weight: 600; cursor: pointer; width: 100%; margin-top: auto; }
        .payment-section { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 15px; padding: 30px; text-align: center; margin-top: 60px; }
        .payment-number { font-size: 1.4em; font-weight: bold; background: #fff; padding: 10px 20px; border-radius: 8px; display: inline-block; margin: 10px 0; border: 1px dashed var(--primary-color); }
    </style>
</head>
<body>

    <header>
        <h1>ADECHOUX</h1>
        <p>Vos bijoux préférés au meilleur prix</p>
    </header>

    <main>
        <h2>Nos Collections</h2>
        <div class="products-grid">
            <!-- PRODUIT 1 -->
            <article class="product-card" id="produit-1">
                <img src="Images/collier-coeur-aigle (1).jpeg" alt="Collier Cœur Aigle d'Ange" class="product-media">
                <div class="product-info">
                    <h3 class="product-name">Collier Cœur Aigle d'Ange</h3>
                    <div class="product-price">4 500 FCFA</div>
                    <div class="quantity-selector">
                        <button class="qty-btn" type="button" onclick="updateQty(this, -1)">-</button>
                        <input type="number" value="1" min="1" class="qty-input" id="qty-1">
                        <button class="qty-btn" type="button" onclick="updateQty(this, 1)">+</button>
                    </div>
                    <button class="order-btn" onclick="orderOnWhatsApp('Collier Cœur Aigle d\'Ange', 4500, 'qty-1', 'produit-1')">Commander</button>
                </div>
            </article>

            <!-- PRODUIT 2 -->
            <article class="product-card" id="produit-2">
                <img src="Images/collier-amitie-barbie.jpeg" alt="Collier d'amitié barbie" class="product-media">
                <div class="product-info">
                    <h3 class="product-name">Collier d'Amitié Barbie</h3>
                    <div class="product-price">4 000 FCFA</div>
                    <div class="quantity-selector">
                        <button class="qty-btn" type="button" onclick="updateQty(this, -1)">-</button>
                        <input type="number" value="1" min="1" class="qty-input" id="qty-2">
                        <button class="qty-btn" type="button" onclick="updateQty(this, 1)">+</button>
                    </div>
                    <button class="order-btn" onclick="orderOnWhatsApp('Collier d\'Amitié Barbie', 4000, 'qty-2', 'produit-2')">Commander</button>
                </div>
            </article>

            <!-- PRODUIT 3 (Vidéo muette) -->
            <article class="product-card" id="produit-3">
                <video muted autoplay loop class="product-media"><source src="Images/collier-coeur-fleche.mp4" type="video/mp4"></video>
                <div class="product-info">
                    <h3 class="product-name">Collier en Cœur avec Flèche</h3>
                    <div class="product-price">6 000 FCFA</div>
                    <div class="quantity-selector">
                        <button class="qty-btn" type="button" onclick="updateQty(this, -1)">-</button>
                        <input type="number" value="1" min="1" class="qty-input" id="qty-3">
                        <button class="qty-btn" type="button" onclick="updateQty(this, 1)">+</button>
                    </div>
                    <button class="order-btn" onclick="orderOnWhatsApp('Collier en Cœur avec Flèche', 6000, 'qty-3', 'produit-3')">Commander</button>
                </div>
            </article>
            
            <!-- PRODUIT 4 -->
            <article class="product-card" id="produit-4">
                <img src="Images/collier-miroir-barbie.jpeg" alt="Collier miroir barbie" class="product-media">
                <div class="product-info">
                    <h3 class="product-name">Collier Miroir Barbie</h3>
                    <div class="product-price">4 000 FCFA</div>
                    <div class="quantity-selector">
                        <button class="qty-btn" type="button" onclick="updateQty(this, -1)">-</button>
                        <input type="number" value="1" min="1" class="qty-input" id="qty-4">
                        <button class="qty-btn" type="button" onclick="updateQty(this, 1)">+</button>
                    </div>
                    <button class="order-btn" onclick="orderOnWhatsApp('Collier Miroir Barbie', 4000, 'qty-4', 'produit-4')">Commander</button>
                </div>
            </article>
        </div>

        <section class="payment-section">
            <h3>Paiement Airtel Money</h3>
            <div class="payment-number">+241 77 50 59 46</div>
        </section>
    </main>

    <script>
        function updateQty(button, change) {
            const input = button.parentElement.querySelector('.qty-input');
            let val = parseInt(input.value) + change;
            input.value = val < 1 ? 1 : val;
        }

        function orderOnWhatsApp(productName, price, qtyInputId, productId) {
            const qty = document.getElementById(qtyInputId).value;
            const total = price * qty;
            const link = window.location.origin + window.location.pathname + "#" + productId;
            const phoneNumber = "24177505946"; 
            const message = `Bonjour Adechoux, je souhaite commander :%0a- Article : ${productName}%0a- Quantité : ${qty}%0a- Total : ${total.toLocaleString('fr-FR')} FCFA%0a- Lien produit : ${link}%0a(Paiement Airtel Money au +241 77 50 59 46)`;
            window.open(`https://wa.me/${phoneNumber}?text=${message}`, '_blank');
        }
    </script>
</body>
</html>
